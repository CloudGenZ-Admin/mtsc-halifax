      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to Dev
        if: github.ref == 'refs/heads/dev'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOUDGENZ_CLIENT_DEMO }}'
